name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z (manual runs only)"
        required: false
      dry_run:
        description: "Build only, publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

env:
  # A tag push publishes; a manual run publishes only when dry_run is unchecked.
  PUBLISH: ${{ github.event_name == 'push' || inputs.dry_run == false }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "version must be X.Y.Z, got '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  python:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      id-token: write # trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: sed -i 's/^version = ".*"/version = "${{ needs.version.outputs.version }}"/' python/pyproject.toml
      - run: python -m pip install build && python -m build python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: python/dist/
      - name: publish
        if: env.PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          packages-dir: python/dist/
          skip-existing: true
          password: ${{ secrets.PYPI_TOKEN || '' }} # empty falls back to trusted publishing

  npm:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      id-token: write # provenance
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - run: |
          sed -i 's/"version": ".*"/"version": "${{ needs.version.outputs.version }}"/' typescript/package.json
      - name: build
        working-directory: typescript
        run: npx --yes -p typescript@5.6.3 tsc -p tsconfig.build.json
      - working-directory: typescript
        run: npm pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-pack
          path: typescript/*.tgz
      - name: publish
        if: env.PUBLISH == 'true'
        working-directory: typescript
        run: |
          v="${{ needs.version.outputs.version }}"
          if [ -n "$(npm view "@kloudlite/sdk@$v" version 2>/dev/null)" ]; then echo "@kloudlite/sdk@$v is already published"; exit 0; fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  rubygems:
    needs: version
    runs-on: ubuntu-latest
    # Trusted publishing: RubyGems trusts this repository and workflow through GitHub's OIDC token, so no
    # API key is stored and no one-time code is asked for (the gemspec requires MFA for pushes).
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.3"
      - run: sed -i 's/s.version = ".*"/s.version = "${{ needs.version.outputs.version }}"/' ruby/kloudlite-sdk.gemspec
      - working-directory: ruby
        run: gem build kloudlite-sdk.gemspec
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gem
          path: ruby/*.gem
      - name: publish
        if: env.PUBLISH == 'true'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: push
        if: env.PUBLISH == 'true'
        working-directory: ruby
        run: |
          v="${{ needs.version.outputs.version }}"
          if curl -sf "https://rubygems.org/api/v2/rubygems/kloudlite-sdk/versions/$v.json" >/dev/null; then echo "kloudlite-sdk $v is already published"; exit 0; fi
          gem push kloudlite-sdk-*.gem

  java:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # setup-java writes the Central Portal credentials into settings.xml (server id `central`) and imports
      # the signing key, so the release profile signs the jars and uploads them to Central.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      # Central finds the signing key by fingerprint on a public keyserver: print which key will sign.
      - name: signing key
        run: |
          gpg --list-secret-keys --with-colons | awk -F: '/^(sec|ssb|fpr)/ {print $1, $5, $10}'
      - run: sed -i '0,/<version>[^<]*<\/version>/s//<version>${{ needs.version.outputs.version }}<\/version>/' java/pom.xml
      # A dry run still builds and signs (`verify`), so a bad key or pom fails before a release; only `deploy` uploads.
      - name: build and sign
        if: env.PUBLISH != 'true'
        run: mvn -B -q -f java/pom.xml -Prelease verify
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: publish
        if: env.PUBLISH == 'true'
        run: mvn -B -f java/pom.xml -Prelease deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: java-jars
          path: java/target/*.jar

  go:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cd go && go build ./... && go vet ./...
      - name: tag go/v${{ needs.version.outputs.version }}
        if: env.PUBLISH == 'true'
        run: |
          git ls-remote --exit-code --tags origin "refs/tags/go/v${{ needs.version.outputs.version }}" >/dev/null 2>&1 && { echo "tag exists"; exit 0; }
          git tag "go/v${{ needs.version.outputs.version }}" "$GITHUB_SHA"
          git push origin "go/v${{ needs.version.outputs.version }}"
