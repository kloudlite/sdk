[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kloudlite"
version = "0.1.0"
description = "Models and datasets from Hugging Face or the kloudlite hub"
requires-python = ">=3.9"
dependencies = ["huggingface_hub"]

[tool.setuptools]
packages = ["kloudlite"]
