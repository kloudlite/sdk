[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kloudlite-sdk"
version = "0.2.1"
description = "Kloudlite SDK for Python"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Kloudlite" }]
classifiers = ["Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://github.com/kloudlite/sdk"
Source = "https://github.com/kloudlite/sdk"

[tool.setuptools]
py-modules = ["kloudlite"]
